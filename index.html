<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pionex Robot" />
  <meta name="theme-color" content="#0b1120" />
  <title>Pionex SOL/USDT Robot</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --card-inner: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px 16px 88px 16px;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .topbar h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .topbar p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(59, 130, 246, 0.18);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.35);
      white-space: nowrap;
    }

    .hero-card,
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .hero-balance {
      font-size: 1.9rem;
      font-weight: 800;
      margin: 6px 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .kpi-label {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .kpi-value {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .kpi-sub {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .day-pnl-group {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .day-pnl-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(30, 41, 59, 0.65);
      font-weight: 700;
      font-size: 0.9rem;
      gap: 8px;
    }

    .pnl-profit {
      color: var(--green);
    }

    .pnl-deficit {
      color: var(--red);
    }

    .pnl-neutral {
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    th,
    td {
      padding: 8px 10px;
      text-align: left;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .trade-excluded {
      opacity: 0.72;
    }

    .notice-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-left: 4px solid var(--amber);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.84rem;
      margin-bottom: 12px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-inner);
    }

    .sim-stat {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 0.9rem;
    }

    .tab-view {
      display: none;
    }

    .tab-view.active {
      display: block;
    }

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0f172a;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 4px 10px 4px;
      z-index: 50;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 2px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Pionex SOL Robot</h1>
      <p id="updatedText">Valós adatforrásra vár...</p>
    </div>
    <span id="statusBadge" class="badge">KÉSZ</span>
  </div>

  <section id="tab-overview" class="tab-view active">
    <div class="hero-card">
      <div class="kpi-label">Teljes portfólió egyenleg</div>
      <div class="hero-balance" id="totalUsd">$0.00</div>
      <div class="kpi-sub" id="statusDetail">Nincs betöltött valós állapot</div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="kpi-label">SOL ár</div>
        <div class="kpi-value" id="solPrice">-</div>
        <div class="kpi-sub" id="entrySub">Bekerülés: -</div>
      </div>
      <div class="card">
        <div class="kpi-label">Szabad USDT / SOL</div>
        <div class="kpi-value" id="freeUsdt">-</div>
        <div class="kpi-sub" id="freeSol">-</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Aktuális árfolyam-diagram</div>
      <canvas id="overview-trend-canvas" width="680" height="220"></canvas>
    </div>
  </section>

  <section id="tab-charts" class="tab-view">
    <div class="card">
      <div class="section-title">SOL árfolyam-trend</div>
      <canvas id="trend-ladder-canvas" width="680" height="280"></canvas>
    </div>
  </section>

  <section id="tab-trades" class="tab-view">
    <div class="card">
      <div class="section-title">Kötések és napi PnL</div>
      <div id="trades-tab-content"></div>
    </div>
  </section>

  <section id="tab-sim" class="tab-view">
    <div class="card">
      <div class="section-title">Árfolyam-szimulátor</div>
      <input type="range" id="simSlider" min="50" max="250" step="0.1" value="71.83" oninput="updateSim()" style="width: 100%; margin: 12px 0;" />
      <div class="sim-stat">
        <span style="color: var(--muted);">Szimulált SOL ár</span>
        <strong id="simPrice">$71.83</strong>
      </div>
      <div class="sim-stat">
        <span style="color: var(--muted);">Becsült pozíció érték</span>
        <strong id="simTotal">$0.00</strong>
      </div>
    </div>
  </section>

  <nav class="tabbar">
    <button type="button" class="tab-btn active" onclick="switchTab('overview', this)">
      <span>📊</span><span>Áttekintés</span>
    </button>
    <button type="button" class="tab-btn" onclick="switchTab('charts', this)">
      <span>📈</span><span>Diagramok</span>
    </button>
    <button type="button" class="tab-btn" onclick="switchTab('trades', this)">
      <span>📜</span><span>Kötések</span>
    </button>
    <button type="button" class="tab-btn" onclick="switchTab('sim', this)">
      <span>🎛</span><span>Szimulátor</span>
    </button>
  </nav>

  <script>
    let latestRealPayload = null;
    let latestRealEntries = [];

    function switchTab(tabName, btnElement) {
      document.querySelectorAll(".tab-view").forEach((el) => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach((el) => el.classList.remove("active"));
      const target = document.getElementById(`tab-${tabName}`);
      if (target) target.classList.add("active");
      if (btnElement) btnElement.classList.add("active");
      if (tabName === "overview") {
        renderTrendChart("overview-trend-canvas", latestRealPayload, latestRealEntries);
      } else if (tabName === "charts") {
        renderTrendChart("trend-ladder-canvas", latestRealPayload, latestRealEntries);
      }
    }

    function getEntryTime(obj) {
      if (!obj || typeof obj !== "object") return null;
      return obj.time || obj.updated_at || obj.timestamp || obj.created_at || obj.date || null;
    }

    function getEntrySize(entry) {
      if (!entry || typeof entry !== "object") return 0;
      const val =
        typeof entry.size === "number"
          ? entry.size
          : typeof entry.sol_amount === "number"
          ? entry.sol_amount
          : typeof entry.amount === "number"
          ? entry.amount
          : 0;
      return Number.isFinite(val) ? val : 0;
    }

    function getEntryUsdt(entry) {
      if (!entry || typeof entry !== "object") return 0;
      const val =
        typeof entry.usdt === "number"
          ? entry.usdt
          : typeof entry.usdt_amount === "number"
          ? entry.usdt_amount
          : typeof entry.cost_usdt === "number"
          ? entry.cost_usdt
          : 0;
      return Number.isFinite(val) ? val : 0;
    }

    function getEntryPnl(entry) {
      if (!entry || typeof entry !== "object") return NaN;
      const val =
        typeof entry.pnl_usdt === "number"
          ? entry.pnl_usdt
          : typeof entry.realized_pnl_usdt === "number"
          ? entry.realized_pnl_usdt
          : NaN;
      return Number.isFinite(val) ? val : NaN;
    }

    function isLargeLegacySell(entry) {
      if (!entry || typeof entry !== "object") return false;
      const side = String(entry.side || "").toUpperCase();
      const sz = getEntrySize(entry);
      return entry.is_legacy === true || entry.source === "manual_history" || (side === "SELL" && Math.abs(sz - 24.8111) < 0.01);
    }

    function isReliableRealPnlTrade(entry) {
      if (!entry || typeof entry !== "object") return false;
      if (!entry.side) return false;
      const pnl = getEntryPnl(entry);
      return Number.isFinite(pnl);
    }

    function getRealTradeDateKey(entry) {
      const rawDate = getEntryTime(entry);
      if (!rawDate) return null;
      const parsed = new Date(rawDate);
      if (Number.isNaN(parsed.getTime())) return null;
      return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}-${String(parsed.getDate()).padStart(2, "0")}`;
    }

    function extractEntriesArray(payload) {
      if (Array.isArray(payload)) return payload;
      if (!payload || typeof payload !== "object") return null;
      if (Array.isArray(payload.recent_trades) && payload.recent_trades.length > 0) return payload.recent_trades;
      if (Array.isArray(payload.trades) && payload.trades.length > 0) return payload.trades;
      if (Array.isArray(payload.closed_trades) && payload.closed_trades.length > 0) return payload.closed_trades;
      if (Array.isArray(payload.history) && payload.history.length > 0) return payload.history;
      if (Array.isArray(payload.recent_trades)) return payload.recent_trades;
      if (Array.isArray(payload.trades)) return payload.trades;
      if (Array.isArray(payload.closed_trades)) return payload.closed_trades;
      if (Array.isArray(payload.history)) return payload.history;
      return null;
    }

    function extractPricePoints(payload, entries) {
      const pts = [];
      const list = Array.isArray(entries) ? entries : [];

      for (const item of list) {
        if (!item || typeof item !== "object") continue;
        const p =
          typeof item.price === "number" && Number.isFinite(item.price) && item.price > 0
            ? item.price
            : typeof item.fill_price === "number" && Number.isFinite(item.fill_price) && item.fill_price > 0
            ? item.fill_price
            : NaN;
        if (Number.isFinite(p)) {
          pts.push({ timestamp: getEntryTime(item), price: p });
        }
      }

      if (payload && typeof payload === "object" && typeof payload.price === "number" && Number.isFinite(payload.price) && payload.price > 0) {
        const last = pts.length > 0 ? pts[pts.length - 1] : null;
        if (!last || last.price !== payload.price) {
          pts.push({ timestamp: getEntryTime(payload), price: payload.price });
        }
      }

      return pts;
    }

    function updateSim() {
      const slider = document.getElementById("simSlider");
      const priceEl = document.getElementById("simPrice");
      const totalEl = document.getElementById("simTotal");
      if (!slider || !priceEl || !totalEl) return;

      const simPrice = Number(slider.value) || 0;
      const solQty =
        latestRealPayload && typeof latestRealPayload.free_crypto === "number"
          ? latestRealPayload.free_crypto
          : 0;
      priceEl.textContent = `$${simPrice.toFixed(2)}`;
      totalEl.textContent = `$${(solQty * simPrice).toFixed(2)}`;
    }

    function renderTrendChart(canvasId, payload, entries) {
      const canvas = document.getElementById(canvasId);
      if (!canvas || typeof canvas.getContext !== "function") return;
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, width, height);

      const pts = extractPricePoints(payload, entries);
      if (pts.length === 0) {
        ctx.fillStyle = "#94a3b8";
        ctx.font = "13px system-ui, sans-serif";
        ctx.fillText("Nincs elegendő valós árpont a grafikonhoz.", 16, 32);
        return;
      }

      const prices = pts.map((p) => p.price);
      const minP = Math.min(...prices);
      const maxP = Math.max(...prices);
      const padX = 52;
      const padY = 24;
      const plotW = Math.max(10, width - padX * 2);
      const plotH = Math.max(10, height - padY * 2);
      const spanP = maxP - minP > 0 ? maxP - minP : Math.max(0.01, maxP * 0.02);

      const toY = (price) => padY + plotH - ((price - minP) / spanP) * plotH;
      const toX = (idx, total) => (total <= 1 ? padX + plotW / 2 : padX + (idx / (total - 1)) * plotW);

      ctx.save();
      ctx.fillStyle = "#94a3b8";
      ctx.font = "11px ui-monospace, monospace";
      ctx.fillText(`$${maxP.toFixed(2)}`, 8, padY + 4);
      ctx.fillText(`$${minP.toFixed(2)}`, 8, padY + plotH);
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach((pt, idx) => {
        const x = toX(idx, pts.length);
        const y = toY(pt.price);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.restore();
    }

    function renderRealTradesTab(entries, sourceName = "ismeretlen forrás", containerId = "trades-tab-content") {
      const container = document.getElementById(containerId);
      const updatedText = document.getElementById("updatedText");
      if (updatedText) {
        updatedText.textContent = `Forrás: ${sourceName}`;
      }
      if (!container) return;

      if (!Array.isArray(entries) || entries.length === 0) {
        container.innerHTML = `<div class="notice-box"><strong>Nincs valós kötésadat:</strong> A(z) <code>${sourceName}</code> forrás nem tartalmaz bejegyzéseket.</div>`;
        return;
      }

      const dailyPnl = new Map();
      const groupedRows = new Map();

      for (const entry of entries) {
        if (!entry || typeof entry !== "object") continue;
        const dateKey = getRealTradeDateKey(entry) || "ismeretlen-datum";
        const pnlValue = getEntryPnl(entry);
        const hasValidPnl = Number.isFinite(pnlValue);
        const largeSell = isLargeLegacySell(entry);
        const isCleanTrade = isReliableRealPnlTrade(entry) && !largeSell;

        if (isCleanTrade && dateKey !== "ismeretlen-datum") {
          const prev = dailyPnl.get(dateKey) || 0;
          dailyPnl.set(dateKey, Number((prev + pnlValue).toFixed(4)));
        }

        if (!groupedRows.has(dateKey)) groupedRows.set(dateKey, []);

        const sideOrStatus = entry.side
          ? `${entry.side}${entry.reason ? ` (${entry.reason})` : ""}`
          : entry.status
          ? `Állapot: ${entry.status}`
          : "Bejegyzés";

        const sz = getEntrySize(entry);
        const solVal = sz > 0 ? sz.toFixed(4) : "-";

        const usdtVal =
          getEntryUsdt(entry) > 0
            ? getEntryUsdt(entry).toFixed(2)
            : typeof entry.total_usd === "number" && Number.isFinite(entry.total_usd)
            ? `${entry.total_usd.toFixed(2)} (portfólió)`
            : "-";

        const pnlText = hasValidPnl
          ? `${pnlValue >= 0 ? "+" : "-"}$${Math.abs(pnlValue).toFixed(2)}`
          : "-";

        const statusLabel = largeSell
          ? "Kiugró SELL (24.81 SOL)"
          : isCleanTrade
          ? "Tiszta PnL"
          : entry.status === "TARTÁS"
          ? "Állapot / árfolyam"
          : "Nincs PnL";

        groupedRows.get(dateKey).push({
          sideOrStatus,
          solVal,
          usdtVal,
          pnlText,
          statusLabel,
          isExcluded: largeSell,
        });
      }

      const sortedDates = Array.from(groupedRows.keys()).sort((a, b) => b.localeCompare(a));
      let html = "";

      for (const dateKey of sortedDates) {
        const daySum = dailyPnl.get(dateKey) ?? 0;
        const sign = daySum > 0 ? "+" : daySum < 0 ? "-" : "";
        const formattedDayPnl = `${sign}$${Math.abs(daySum).toFixed(2)}`;
        const badgeClass = daySum > 0 ? "pnl-profit" : daySum < 0 ? "pnl-deficit" : "pnl-neutral";

        const rowsHtml = groupedRows
          .get(dateKey)
          .map(
            (r) => `
              <tr class="${r.isExcluded ? "trade-excluded" : ""}">
                <td>${r.sideOrStatus}</td>
                <td>${r.solVal}</td>
                <td>${r.usdtVal}</td>
                <td>${r.pnlText}</td>
                <td>${r.statusLabel}</td>
              </tr>
            `
          )
          .join("");

        html += `
          <div class="day-pnl-group">
            <div class="day-pnl-header">
              <span>${dateKey}</span>
              <span class="${badgeClass}">Napi PnL: ${formattedDayPnl}</span>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Típus / ok</th>
                  <th>SOL</th>
                  <th>USDT</th>
                  <th>PnL</th>
                  <th>Megjegyzés</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function updateOverviewFromPayload(payload, entries) {
      const totalEl = document.getElementById("totalUsd");
      const freeUsdtEl = document.getElementById("freeUsdt");
      const freeSolEl = document.getElementById("freeSol");
      const solPriceEl = document.getElementById("solPrice");
      const entrySubEl = document.getElementById("entrySub");
      const statusDetailEl = document.getElementById("statusDetail");
      const badgeEl = document.getElementById("statusBadge");

      const list = Array.isArray(entries) ? entries : [];
      const lastEntryWithTotal = [...list].reverse().find((e) => e && typeof e.total_usd === "number");
      const lastEntryWithPrice = [...list].reverse().find((e) => e && typeof e.price === "number");
      const lastEntryWithStatus = [...list].reverse().find((e) => e && e.status);

      const totalUsd =
        payload && typeof payload.total_usd === "number"
          ? payload.total_usd
          : lastEntryWithTotal
          ? lastEntryWithTotal.total_usd
          : null;

      const price =
        payload && typeof payload.price === "number"
          ? payload.price
          : lastEntryWithPrice
          ? lastEntryWithPrice.price
          : null;

      if (typeof totalUsd === "number" && totalEl) {
        totalEl.textContent = `$${totalUsd.toFixed(2)}`;
      }
      if (payload && typeof payload.free_usdt === "number" && freeUsdtEl) {
        freeUsdtEl.textContent = `$${payload.free_usdt.toFixed(2)}`;
      }
      if (payload && typeof payload.free_crypto === "number" && freeSolEl) {
        freeSolEl.textContent = `${payload.free_crypto.toFixed(4)} SOL`;
      }
      if (typeof price === "number" && solPriceEl) {
        solPriceEl.textContent = `$${price.toFixed(2)}`;
      }
      if (payload && typeof payload.entry_price === "number" && entrySubEl) {
        entrySubEl.textContent = `Bekerülés: $${payload.entry_price.toFixed(2)}`;
      } else if (entrySubEl) {
        entrySubEl.textContent = "Bekerülés: -";
      }

      const detailText =
        (payload && (payload.status_detail || payload.status)) ||
        (lastEntryWithStatus ? `Utolsó állapot: ${lastEntryWithStatus.status}` : null);

      if (detailText && statusDetailEl) {
        statusDetailEl.textContent = String(detailText);
      }
      if (payload && payload.status && badgeEl) {
        badgeEl.textContent = String(payload.status).slice(0, 12);
      } else if (detailText && badgeEl) {
        badgeEl.textContent = String(detailText).slice(0, 12);
      }
    }

    function refreshAllRobotViews(payload, sourceName = "valós forrás") {
      latestRealPayload = payload;
      latestRealEntries = extractEntriesArray(payload) || [];

      updateOverviewFromPayload(payload, latestRealEntries);
      renderRealTradesTab(latestRealEntries, sourceName, "trades-tab-content");
      renderTrendChart("overview-trend-canvas", latestRealPayload, latestRealEntries);
      renderTrendChart("trend-ladder-canvas", latestRealPayload, latestRealEntries);
      updateSim();
    }

    async function loadPionexRealFiles() {
      const container = document.getElementById("trades-tab-content");
      const updatedText = document.getElementById("updatedText");

      let statusData = null;
      let historyData = null;

      try {
        const statusResp = await fetch("./pionex_status.json", { cache: "no-store" });
        if (statusResp.ok) statusData = await statusResp.json();
      } catch (_) {}

      try {
        const historyResp = await fetch("./pionex_history.json", { cache: "no-store" });
        if (historyResp.ok) historyData = await historyResp.json();
      } catch (_) {}

      if (!statusData && !historyData) {
        if (updatedText) {
          updatedText.textContent = "Forrás: pionex_status.json / pionex_history.json nem érhető el";
        }
        if (container) {
          container.innerHTML = `<div class="notice-box"><strong>Nem található adat:</strong> A <code>pionex_status.json</code> és <code>pionex_history.json</code> fájlok nem érhetők el.</div>`;
        }
        return false;
      }

      const entriesFromHistory = extractEntriesArray(historyData) || [];
      const entriesFromStatus = extractEntriesArray(statusData) || [];
      const mergedEntries = entriesFromHistory.length > 0 ? entriesFromHistory : entriesFromStatus;

      const combinedPayload = {
        ...(typeof historyData === "object" && !Array.isArray(historyData) ? historyData : {}),
        ...(typeof statusData === "object" && !Array.isArray(statusData) ? statusData : {}),
        recent_trades: mergedEntries,
      };

      refreshAllRobotViews(combinedPayload, "pionex_status.json + pionex_history.json");
      return true;
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadPionexRealFiles();
      updateSim();
    });
  </script>
</body>
</html>
