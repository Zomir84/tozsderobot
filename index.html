<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pionex SOL Robot — Áttekintés</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1020;
      color: #f1f5f9;
      padding: 16px;
      padding-bottom: 84px;
    }
    .wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: #131b2e;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 16px;
      padding: 16px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .muted { color: #94a3b8; font-size: 0.85rem; }
    .big-val { font-size: 2rem; font-weight: 800; margin-top: 4px; }
    .med-val { font-size: 1.35rem; font-weight: 700; margin-top: 4px; }
    .pnl-pill {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      background: rgba(148, 163, 184, 0.12);
      color: #e2e8f0;
    }
    .pnl-pos { background: rgba(34, 197, 94, 0.16); color: #22c55e; }
    .pnl-neg { background: rgba(239, 68, 68, 0.16); color: #ef4444; }
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #0f172a;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      display: flex;
      justify-content: space-around;
      padding: 10px 8px;
    }
    .bottom-nav span { font-size: 0.8rem; color: #94a3b8; }
    .bottom-nav .active { color: #60a5fa; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="muted">Teljes egyenleg (SOL + szabad USDT)</div>
      <div id="total-usd" class="big-val">$0.00</div>
      <div id="status-detail" class="muted" style="margin-top: 4px;">0.0000 SOL (0.00 USDT)</div>

      <div id="live-pnl-pct" class="pnl-pill">
        Pillanatnyi pozíció: 0.00% ($0.00)
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="muted">SOL ár</div>
        <div id="sol-price" class="med-val">$0.00</div>
        <div id="entry-price" class="muted" style="margin-top: 4px;">Bekerülés: —</div>
      </div>

      <div class="card">
        <div class="muted">Szabad USDT / SOL</div>
        <div id="free-usdt" class="med-val">$0.00</div>
        <div id="free-sol" class="muted" style="margin-top: 4px;">0.0000 SOL</div>
      </div>
    </div>

    <div class="card">
      <div class="muted">Technikai mutatók</div>
      <div id="indicators-line" style="margin-top: 8px; font-size: 0.9rem; line-height: 1.5;">
        MA10: — • MA30: — • RSI: — • ADX: —
      </div>
      <div id="updated-at" class="muted" style="margin-top: 8px; font-size: 0.78rem;">
        Frissítés: —
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <span class="active">Áttekintés</span>
    <span>Diagramok</span>
    <span>Kötések</span>
    <span>Szimulátor</span>
  </nav>

  <script>
    function renderLivePnlPct(status) {
      const el = document.getElementById("live-pnl-pct");
      if (!el) return;

      const hasPos = Boolean(status && status.has_position);
      const pctNum = Number(status && status.profit_pct != null ? status.profit_pct : 0);
      const usdtNum = Number(status && status.profit_usdt != null ? status.profit_usdt : 0);
      const pctText = (status && status.pnl_pct_text)
        ? status.pnl_pct_text
        : `${pctNum >= 0 ? "+" : ""}${pctNum.toFixed(2)}%`;

      el.classList.remove("pnl-pos", "pnl-neg");

      if (!hasPos) {
        el.textContent = "Pillanatnyi pozíció: 0.00% ($0.00)";
        return;
      }

      const signUsdt = usdtNum >= 0 ? `+$${usdtNum.toFixed(2)}` : `-$${Math.abs(usdtNum).toFixed(2)}`;
      el.textContent = `Pillanatnyi pozíció: ${pctText} (${signUsdt})`;

      if (pctNum > 0) {
        el.classList.add("pnl-pos");
      } else if (pctNum < 0) {
        el.classList.add("pnl-neg");
      }
    }

    function renderStatus(s) {
      if (!s) return;
      const price = Number(s.price || 0);
      const totalUsd = Number(s.total_usd || 0);
      const freeUsdt = Number(s.free_usdt || 0);
      const freeCrypto = Number(s.free_crypto || 0);
      const entryPrice = s.entry_price != null ? Number(s.entry_price) : null;

      document.getElementById("total-usd").textContent = `$${totalUsd.toFixed(2)}`;
      document.getElementById("status-detail").textContent =
        s.status_detail || `${freeCrypto.toFixed(4)} SOL (${(freeCrypto * price).toFixed(2)} USDT)`;

      document.getElementById("sol-price").textContent = `$${price.toFixed(2)}`;
      document.getElementById("entry-price").textContent =
        entryPrice ? `Bekerülés: $${entryPrice.toFixed(2)}` : "Bekerülés: —";

      document.getElementById("free-usdt").textContent = `$${freeUsdt.toFixed(2)}`;
      document.getElementById("free-sol").textContent = `${freeCrypto.toFixed(4)} SOL`;

      document.getElementById("indicators-line").textContent =
        `MA10: ${s.ma10 ?? "—"} • MA30: ${s.ma30 ?? "—"} • RSI: ${s.rsi ?? "—"} • ADX: ${s.adx ?? "—"}`;

      document.getElementById("updated-at").textContent =
        `Frissítés: ${s.updated_at || "—"} (${s.status || "—"})`;

      renderLivePnlPct(s);
    }

    async function loadStatus() {
      try {
        const res = await fetch(`./pionex_status.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        renderStatus(data);
      } catch (err) {
        console.error("Státusz betöltési hiba:", err);
      }
    }

    loadStatus();
    setInterval(loadStatus, 30000);
  </script>
</body>
</html>
