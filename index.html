<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pionex SOL Robot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }
    .wrap {
      max-width: 540px;
      margin: 0 auto;
    }
    .card {
      background: #161b26;
      border: 1px solid #283144;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 999px;
      background: #233044;
      color: #7cc4fa;
      font-weight: 700;
      font-size: 12px;
    }
    .balance {
      font-size: 28px;
      font-weight: 800;
      margin: 6px 0 4px;
    }
    .muted {
      color: #9aa6bd;
      font-size: 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      font-family: inherit;
      cursor: pointer;
    }
    .btn-secondary {
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid #3a4762;
      background: #1f2737;
      color: #dce4f2;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-sell {
      padding: 9px 15px;
      border-radius: 8px;
      border: none;
      background: #c93b3b;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
    }
    .btn-sell:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #sell-feedback {
      margin-top: 8px;
      font-size: 12px;
      color: #7cc4fa;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top-row">
        <div>
          <div style="font-size: 18px; font-weight: 700;">Pionex SOL Robot</div>
          <div id="robot-time" class="muted">Robot: betöltés...</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span id="status-badge" class="badge">TARTÁS</span>
          <button type="button" class="btn-secondary" onclick="betoltStatusz()">Frissít</button>
        </div>
      </div>

      <div class="muted" style="margin-top: 12px;">Teljes portfólió egyenleg</div>
      <div id="total-usd" class="balance">$--.--</div>
      <div id="status-detail" class="muted">Állapot betöltése...</div>
    </div>

    <div class="grid-2">
      <div class="card" style="margin-bottom: 0;">
        <div class="muted">SOL ár (robot)</div>
        <div id="sol-price" style="font-size: 20px; font-weight: 700; margin-top: 4px;">$--.--</div>
        <div id="entry-price" class="muted" style="margin-top: 4px;">Bekerülés: -</div>
      </div>
      <div class="card" style="margin-bottom: 0;">
        <div class="muted">Szabad USDT</div>
        <div id="free-usdt" style="font-size: 20px; font-weight: 700; margin-top: 4px;">$--.--</div>
        <div id="free-crypto" class="muted" style="margin-top: 4px;">0.000000 SOL</div>
      </div>
    </div>

    <!-- KÉZI ELADÁS VEZÉRLŐBLOKK -->
    <div id="sell-control-box" class="card">
      <div class="top-row" style="flex-wrap: wrap;">
        <div>
          <div style="font-weight: 700; font-size: 14px;">Kézi pozíciózárás</div>
          <div id="sell-status-hint" class="muted">Ellenőrzés...</div>
        </div>
        <div class="btn-row">
          <button id="token-setup-btn" type="button" class="btn-secondary" onclick="beallitGitHubToken()">
            Token
          </button>
          <button id="force-sell-btn" type="button" class="btn-sell" onclick="azonnaliEladasInditasa()" disabled>
            Eladás
          </button>
        </div>
      </div>
      <div id="sell-feedback"></div>
    </div>
  </div>

  <script>
    const GH_OWNER = "Zomir84";
    const GH_REPO = "tozsderobot";
    const GH_WORKFLOW_FILE = "pionex.yml";
    const TOKEN_STORAGE_KEY = "pionex_gh_dispatch_token";

    let aktualisStatusz = null;

    function frissitEladasGombAllapot(statusAdat) {
      aktualisStatusz = statusAdat || {};
      const btn = document.getElementById("force-sell-btn");
      const hint = document.getElementById("sell-status-hint");
      if (!btn || !hint) return;

      const vanPoz = Boolean(aktualisStatusz.has_position) && Number(aktualisStatusz.free_crypto || 0) > 0;
      if (vanPoz) {
        btn.disabled = false;
        hint.textContent = `Nyitott: ${aktualisStatusz.free_crypto} ${aktualisStatusz.base_coin || "SOL"} (~$${Number(aktualisStatusz.position_usd || 0).toFixed(2)})`;
      } else {
        btn.disabled = true;
        hint.textContent = "Nincs nyitott eladható pozíció.";
      }
    }

    function beallitGitHubToken() {
      const regi = localStorage.getItem(TOKEN_STORAGE_KEY) || "";
      const uj = prompt(
        "Add meg a Fine-grained GitHub tokent (csak Zomir84/tozsderobot -> Actions: Read and write):",
        regi
      );
      const fb = document.getElementById("sell-feedback");
      if (uj === null) return;
      const tisztitott = uj.trim();
      if (!tisztitott) {
        localStorage.removeItem(TOKEN_STORAGE_KEY);
        if (fb) fb.textContent = "Token törölve.";
        return;
      }
      localStorage.setItem(TOKEN_STORAGE_KEY, tisztitott);
      if (fb) fb.textContent = "GitHub token elmentve ezen az eszközön.";
    }

    async function azonnaliEladasInditasa() {
      const fb = document.getElementById("sell-feedback");
      const btn = document.getElementById("force-sell-btn");
      const token = (localStorage.getItem(TOKEN_STORAGE_KEY) || "").trim();

      if (!token) {
        if (fb) fb.textContent = "Előbb állítsd be a GitHub tokent a 'Token' gombbal!";
        return;
      }

      const coin = aktualisStatusz?.base_coin || "SOL";
      const mennyiseg = aktualisStatusz?.free_crypto ?? "";
      const ar = aktualisStatusz?.price ?? "";
      const ok = confirm(
        `Biztosan eladod a nyitott pozíciót?\n\nEszköz: ${coin}\nMennyiség: ${mennyiseg}\nUtolsó ár: $${ar}`
      );
      if (!ok) return;

      btn.disabled = true;
      if (fb) fb.textContent = "Eladási workflow indítása a GitHubon...";

      try {
        const valasz = await fetch(
          `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${GH_WORKFLOW_FILE}/dispatches`,
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              ref: "main",
              inputs: {
                force_sell: "true"
              }
            })
          }
        );

        if (valasz.status === 204) {
          if (fb) fb.textContent = "Eladás elindítva! ~20–40 mp alatt lefut a GitHubon és frissül az app.";
        } else {
          const hibaSzoveg = await valasz.text();
          if (fb) fb.textContent = `Hiba (${valasz.status}): ${hibaSzoveg}`;
          btn.disabled = false;
        }
      } catch (err) {
        if (fb) fb.textContent = `Hálózati hiba: ${err.message}`;
        btn.disabled = false;
      }
    }

    async function betoltStatusz() {
      try {
        const res = await fetch(`status.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.getElementById("status-badge").textContent = data.status || "ISMERETLEN";
        document.getElementById("total-usd").textContent = `$${Number(data.total_usd ?? 0).toFixed(2)}`;
        document.getElementById("status-detail").textContent = data.status_detail || "";
        document.getElementById("sol-price").textContent = `$${Number(data.price ?? 0).toFixed(2)}`;
        document.getElementById("entry-price").textContent =
          data.entry_price != null ? `Bekerülés: $${Number(data.entry_price).toFixed(2)}` : "Bekerülés: -";
        document.getElementById("free-usdt").textContent = `$${Number(data.free_usdt ?? 0).toFixed(2)}`;
        document.getElementById("free-crypto").textContent =
          `${Number(data.free_crypto ?? 0).toFixed(6)} ${data.base_coin || "SOL"}`;
        document.getElementById("robot-time").textContent =
          data.updated_at ? `Robot: ${new Date(data.updated_at).toLocaleTimeString("hu-HU")}` : "Robot: -";

        frissitEladasGombAllapot(data);
      } catch (err) {
        const fb = document.getElementById("sell-feedback");
        if (fb) fb.textContent = `Állapot betöltési hiba: ${err.message}`;
      }
    }

    betoltStatusz();
    setInterval(betoltStatusz, 60000);
  </script>
</body>
</html>
