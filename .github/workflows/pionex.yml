name: Pionex SOL Robot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_sell:
        description: "Azonnali kézi eladás indítása"
        required: false
        default: "false"
      force_buy:
        description: "Azonnali kézi vétel indítása"
        required: false
        default: "false"
      manual_buy_usdt:
        description: "Kézi vétel összege USDT-ben"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
      - name: Repó lehúzása
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance ta pandas

      - name: Robot futtatása
        env:
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_SECRET_KEY: ${{ secrets.PIONEX_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SELL: ${{ inputs.force_sell }}
          FORCE_BUY: ${{ inputs.force_buy }}
          MANUAL_BUY_USDT: ${{ inputs.manual_buy_usdt }}
        run: python pionex_robot.py

      - name: Állapotfájlok mentése
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json history.json
          if ! git diff --staged --quiet; then
            git commit -m "Update robot status [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
