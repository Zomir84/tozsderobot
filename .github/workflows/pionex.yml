name: Pionex Robot (Eles)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_sell:
        description: 'Azonnali kényszerített eladás (true/false)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
      - name: Repó lekérése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Függőségek telepítése
        run: pip install -r requirements.txt

      - name: Robot futtatása
        env:
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_SECRET_KEY: ${{ secrets.PIONEX_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SELL: ${{ inputs.force_sell }}
        run: python pionex_robot.py

      - name: Állapotfájlok mentése
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Robot frissítés"
            git push
          fi
