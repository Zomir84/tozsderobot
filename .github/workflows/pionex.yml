name: Pionex Robot (Eles)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  futtatas:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Csomagok telepítése
        run: pip install -r requirements.txt

      - name: Pionex robot futtatása
        env:
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_SECRET_KEY: ${{ secrets.PIONEX_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pionex_robot.py

      - name: Dashboard adatok mentése
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Pionex Robot"
          git add status.json history.json
          git diff --staged --quiet || (git commit -m "Dashboard adatok frissítése" && git push)
